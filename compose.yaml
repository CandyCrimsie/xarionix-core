name: xarionix-core

x-core: &core
  image: xarionix-core:0.1.0
  environment: &core-env
    XARIONIX_ENVIRONMENT: production
    XARIONIX_INSTALL_LANGUAGE: ${XARIONIX_INSTALL_LANGUAGE:?}
    XARIONIX_KEYCLOAK_MODE: ${XARIONIX_KEYCLOAK_MODE:?}
    XARIONIX_PUBLIC_URL: ${XARIONIX_PUBLIC_URL:?}
    XARIONIX_OIDC_ISSUER: ${XARIONIX_OIDC_ISSUER:?}
    XARIONIX_OIDC_AUDIENCE: xarionix-core
    XARIONIX_MODULES_AUDIENCE: ${XARIONIX_MODULES_AUDIENCE:-xarionix-core-modules}
    XARIONIX_DEPLOYMENT_AUDIENCE: ${XARIONIX_DEPLOYMENT_AUDIENCE:-xarionix-core-deployment}
    XARIONIX_GATEWAY_AUDIENCE: ${XARIONIX_GATEWAY_AUDIENCE:-xarionix-core-gateway}
    XARIONIX_GATEWAY_REQUEST_BYTES: ${XARIONIX_GATEWAY_REQUEST_BYTES:-65536}
    XARIONIX_GATEWAY_RESPONSE_BYTES: ${XARIONIX_GATEWAY_RESPONSE_BYTES:-1048576}
    XARIONIX_GATEWAY_JSON_DEPTH: ${XARIONIX_GATEWAY_JSON_DEPTH:-16}
    XARIONIX_GATEWAY_OPERATION_ID_LENGTH: ${XARIONIX_GATEWAY_OPERATION_ID_LENGTH:-63}
    XARIONIX_GATEWAY_DEADLINE_SECONDS: ${XARIONIX_GATEWAY_DEADLINE_SECONDS:-10}
    XARIONIX_GATEWAY_PENDING: ${XARIONIX_GATEWAY_PENDING:-64}
    XARIONIX_GATEWAY_INGRESS: ${XARIONIX_GATEWAY_INGRESS:-64}
    XARIONIX_GATEWAY_BODY_SECONDS: ${XARIONIX_GATEWAY_BODY_SECONDS:-10}
    XARIONIX_GATEWAY_PER_HOST: ${XARIONIX_GATEWAY_PER_HOST:-8}
    XARIONIX_GATEWAY_PER_INSTALLATION: ${XARIONIX_GATEWAY_PER_INSTALLATION:-2}
    XARIONIX_GATEWAY_PER_USER: ${XARIONIX_GATEWAY_PER_USER:-4}
    XARIONIX_MODULES_CHECK_IN_SECONDS: ${XARIONIX_MODULES_CHECK_IN_SECONDS:-15}
    XARIONIX_MODULES_STALE_SECONDS: ${XARIONIX_MODULES_STALE_SECONDS:-90}
    XARIONIX_MODULES_LEASE_SECONDS: ${XARIONIX_MODULES_LEASE_SECONDS:-30}
    XARIONIX_PACKAGES_MAX_BYTES: ${XARIONIX_PACKAGES_MAX_BYTES:-134217728}
    XARIONIX_PACKAGES_MAX_FILES: ${XARIONIX_PACKAGES_MAX_FILES:-1024}
    XARIONIX_PACKAGES_MAX_FILE_BYTES: ${XARIONIX_PACKAGES_MAX_FILE_BYTES:-33554432}
    XARIONIX_PACKAGES_MAX_TOTAL_BYTES: ${XARIONIX_PACKAGES_MAX_TOTAL_BYTES:-268435456}
    XARIONIX_PACKAGES_MAX_PATH_DEPTH: ${XARIONIX_PACKAGES_MAX_PATH_DEPTH:-12}
    XARIONIX_PACKAGES_MAX_PATH_BYTES: ${XARIONIX_PACKAGES_MAX_PATH_BYTES:-240}
    XARIONIX_PACKAGES_MAX_RATIO: ${XARIONIX_PACKAGES_MAX_RATIO:-100}
    XARIONIX_PACKAGES_MAX_MANIFEST_BYTES: ${XARIONIX_PACKAGES_MAX_MANIFEST_BYTES:-262144}
    XARIONIX_PACKAGES_MAX_SIGNATURE_BYTES: ${XARIONIX_PACKAGES_MAX_SIGNATURE_BYTES:-4096}
    XARIONIX_PACKAGES_UPLOAD_SECONDS: ${XARIONIX_PACKAGES_UPLOAD_SECONDS:-120}
    XARIONIX_OIDC_BACKCHANNEL: ${XARIONIX_OIDC_BACKCHANNEL:-}
    XARIONIX_DOCS_ENABLED: ${XARIONIX_DOCS_ENABLED:-false}
    XARIONIX_CORS_ORIGINS: ${XARIONIX_CORS_ORIGINS:-[]}
    XARIONIX_ADMIN_ACR_VALUES: ${XARIONIX_ADMIN_ACR_VALUES:-[]}
    XARIONIX_ADMIN_AUTH_MAX_AGE_SECONDS: ${XARIONIX_ADMIN_AUTH_MAX_AGE_SECONDS:-300}
    XARIONIX_DB_HOST: postgres
    XARIONIX_DB_USER: ${XARIONIX_DB_USER:-core_app}
    XARIONIX_DB_NAME: xarionix_core
    XARIONIX_DB_PASSWORD: ${XARIONIX_DB_PASSWORD:?}
  read_only: true
  # Quoted short syntax preserves noexec/nosuid (long tmpfs syntax exposes only size/mode).
  tmpfs:
    - "/tmp:rw,noexec,nosuid,nodev,size=64m"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [edge, core_db]

services:
  postgres:
    image: ${XARIONIX_POSTGRES_IMAGE:-postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5}
    environment:
      POSTGRES_USER: core_bootstrap
      POSTGRES_DB: xarionix_core
      POSTGRES_PASSWORD: ${XARIONIX_DB_BOOTSTRAP_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      APP_USER: core_app
      APP_PASSWORD: ${XARIONIX_DB_PASSWORD:?}
    volumes:
      - type: volume
        source: core_database
        target: /var/lib/postgresql
      - type: bind
        source: ./deploy/postgres/10-app-user.sh
        target: /docker-entrypoint-initdb.d/10-app-user.sh
        read_only: true
        bind: {create_host_path: false}
    networks: [core_db]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 30
  migrate:
    <<: *core
    environment:
      <<: *core-env
      XARIONIX_DB_USER: ${XARIONIX_MIGRATION_DB_USER:-core_app}
      XARIONIX_DB_PASSWORD: ${XARIONIX_MIGRATION_DB_PASSWORD:-${XARIONIX_DB_PASSWORD}}
    command: [alembic, upgrade, head]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
  core:
    <<: *core
    build: .
    volumes:
      - type: volume
        source: packages
        target: /var/lib/xarionix/packages
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=12)"]
      interval: 15s
      timeout: 14s
      retries: 10
      start_period: 30s
  nginx:
    image: ${XARIONIX_NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03}
    user: ${XARIONIX_NGINX_UID:-101}:${XARIONIX_NGINX_UID:-101}
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    ports: ["80:8080", "443:8443"]
    volumes:
      - type: bind
        source: ./deploy/generated/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./deploy/generated/tls
        target: /etc/xarionix/tls
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=32m"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    depends_on:
      core: {condition: service_started}
    restart: unless-stopped
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  core_database:
  packages:
networks:
  edge:
  core_db:
    internal: true
