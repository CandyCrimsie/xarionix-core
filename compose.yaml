name: xarionix-core

x-core: &core
  image: xarionix-core:0.1.0
  build: .
  environment: &core-env
    XARIONIX_ENVIRONMENT: production
    XARIONIX_INSTALL_LANGUAGE: ${XARIONIX_INSTALL_LANGUAGE:?}
    XARIONIX_KEYCLOAK_MODE: ${XARIONIX_KEYCLOAK_MODE:?}
    XARIONIX_PUBLIC_URL: ${XARIONIX_PUBLIC_URL:?}
    XARIONIX_OIDC_ISSUER: ${XARIONIX_OIDC_ISSUER:?}
    XARIONIX_OIDC_AUDIENCE: xarionix-core
    XARIONIX_OIDC_BACKCHANNEL: ${XARIONIX_OIDC_BACKCHANNEL:-}
    XARIONIX_DOCS_ENABLED: ${XARIONIX_DOCS_ENABLED:-false}
    XARIONIX_CORS_ORIGINS: ${XARIONIX_CORS_ORIGINS:-[]}
    XARIONIX_DB_HOST: postgres
    XARIONIX_DB_USER: core_app
    XARIONIX_DB_NAME: xarionix_core
    XARIONIX_DB_PASSWORD: ${XARIONIX_DB_PASSWORD:?}
  read_only: true
  tmpfs: [/tmp:rw,noexec,nosuid,size=64m]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [edge, core_db]

services:
  postgres:
    image: ${XARIONIX_POSTGRES_IMAGE:-postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5}
    environment:
      POSTGRES_USER: core_bootstrap
      POSTGRES_DB: xarionix_core
      POSTGRES_PASSWORD: ${XARIONIX_DB_BOOTSTRAP_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      APP_USER: core_app
      APP_PASSWORD: ${XARIONIX_DB_PASSWORD:?}
    volumes:
      - core_database:/var/lib/postgresql
      - ./deploy/postgres/10-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    networks: [core_db]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 30
  migrate:
    <<: *core
    command: [alembic, upgrade, head]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
  core:
    <<: *core
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=12)"]
      interval: 15s
      timeout: 14s
      retries: 10
      start_period: 30s
  nginx:
    image: ${XARIONIX_NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.30.6-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03}
    user: ${XARIONIX_NGINX_UID:-101}:${XARIONIX_NGINX_UID:-101}
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    ports: ["80:8080", "443:8443"]
    volumes:
      - ./deploy/generated/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/generated/tls:/etc/xarionix/tls:ro
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    depends_on:
      core: {condition: service_started}
    restart: unless-stopped
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  core_database:
networks:
  edge:
  core_db:
    internal: true
