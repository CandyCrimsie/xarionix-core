[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "xarionix-sdk"
version = "0.1.0"
description = "SDK изолированных бизнес-модулей Xarionix"
requires-python = ">=3.12,<3.16"
dependencies = []

[project.scripts]
xarionix-module = "xarionix_sdk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xarionix_sdk"]
