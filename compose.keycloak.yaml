services:
  core:
    depends_on:
      keycloak: {condition: service_healthy}
  keycloak-postgres:
    image: ${XARIONIX_POSTGRES_IMAGE:-postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5}
    environment:
      POSTGRES_USER: keycloak_bootstrap
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD: ${XARIONIX_KC_DB_BOOTSTRAP_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      APP_USER: keycloak_app
      APP_PASSWORD: ${XARIONIX_KC_DB_PASSWORD:?}
    volumes:
      - type: volume
        source: keycloak_database
        target: /var/lib/postgresql
      - type: bind
        source: ./deploy/postgres/10-app-user.sh
        target: /docker-entrypoint-initdb.d/10-app-user.sh
        read_only: true
        bind: {create_host_path: false}
    networks: [keycloak_db]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 30
  keycloak:
    image: ${XARIONIX_KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332}
    command: [start, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: ${XARIONIX_KC_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${XARIONIX_KC_ADMIN_PASSWORD:?}
      KC_HOSTNAME: ${XARIONIX_KEYCLOAK_PUBLIC_URL:?}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
    volumes:
      - type: bind
        source: ./deploy/generated/xarionix-realm.json
        target: /opt/keycloak/data/import/xarionix-realm.json
        read_only: true
        bind: {create_host_path: false}
    networks: [edge, keycloak_db]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # JVM may extract executable native libraries here; noexec is intentionally not set.
    tmpfs:
      - "/tmp:rw,nosuid,nodev,size=128m"
    restart: unless-stopped
    depends_on:
      keycloak-postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, /bin/bash, -ec, "{ printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&0; grep -q '200 OK'; } 0<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s
volumes:
  keycloak_database:
networks:
  keycloak_db:
    internal: true
