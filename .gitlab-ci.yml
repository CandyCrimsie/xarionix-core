stages: [validate, lint, test, integration, security, build, publish]

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_DEFAULT_TIMEOUT: "60"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  DOCKER_BUILDKIT: "1"

default:
  interruptible: true

.python:
  image: python:3.13.18-slim@sha256:76baad6037690d6e8c4397fbcaef17bca6f19eecef822b708fe8fa3417d30bb5
  before_script:
    - apt-get update && apt-get install --no-install-recommends -y git
    - python3 -m venv .venv
    - .venv/bin/python -m pip install -r requirements-dev.lock
    - .venv/bin/python -m pip install --no-deps -e .

# Existing group Docker executor, same as ERP/Web. Only this pinned rootless
# SERVICE is allowed privileged mode in config.toml; job containers are not.
.docker:
  tags: [debian]
  image: docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
  services:
    - name: docker:29.9.2-dind-rootless@sha256:ae083cc7de51e7a8e5a597f8fb774ca7914c408a95fc0f1477826a913479518a
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2376"
  variables:
    FF_NETWORK_PER_BUILD: "1"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_CERT_PATH: /certs/client
    DOCKER_TLS_VERIFY: "1"
  before_script:
    - apk add --no-cache python3 git

.full:
  rules: &full_rules
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

validate:repository:
  extends: .python
  stage: validate
  script:
    - .venv/bin/python -m scripts.validate

validate:compose:
  extends: .docker
  stage: validate
  script:
    - python3 -u -m scripts.docker_job run compose

lint:python-shell:
  extends: .python
  stage: lint
  script:
    - .venv/bin/ruff check app scripts tests migrations sdk/python/src
    - .venv/bin/ruff format --check app scripts tests migrations sdk/python/src
    - .venv/bin/mypy app scripts migrations
    - .venv/bin/mypy sdk/python/src
    - bash -n install.sh
    - sh -n deploy/postgres/10-app-user.sh

test:sdk-wheel:
  extends: .python
  stage: test
  script:
    - .venv/bin/python -m pip wheel --no-deps sdk/python --wheel-dir dist/sdk
    - .venv/bin/python -I scripts/sdk_wheel_smoke.py dist/sdk/xarionix_sdk-0.1.0-py3-none-any.whl

test:unit:
  # Includes offline XPKG signature vectors, malicious archives and CLI regressions.
  extends: .python
  stage: test
  script:
    - mkdir -p reports
    - .venv/bin/pytest -vv -m "not integration" --junitxml=reports/unit.xml --cov=app --cov=scripts --cov=xarionix_sdk --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=70
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+(?:\.\d+)?%)/'
  artifacts:
    when: always
    expire_in: 14 days
    paths: [reports/unit.xml, reports/coverage.xml]
    reports:
      junit: reports/unit.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml

integration:managed-stack:
  extends: .docker
  stage: integration
  rules: *full_rules
  timeout: 30 minutes
  variables:
    XARIONIX_RUN_DOCKER_TESTS: "1"
  script:
    - python3 -u -m scripts.docker_job run integration
  artifacts:
    when: always
    expire_in: 14 days
    paths: [reports/integration.xml, reports/integration-diagnostics.json]
    reports:
      junit: reports/integration.xml

security:python:
  extends: .python
  stage: security
  script:
    - .venv/bin/bandit -q -r app scripts sdk/python/src
    - .venv/bin/pip-audit -r requirements.lock --strict --timeout 60 --progress-spinner off
    - .venv/bin/pip-audit -r requirements-dev.lock --strict --timeout 60 --progress-spinner off

security:git-secrets:
  extends: .docker
  stage: security
  variables:
    GIT_DEPTH: "0"
  script:
    - python3 -u -m scripts.docker_job run secrets
  artifacts:
    when: always
    expire_in: 7 days
    paths: [reports/gitleaks.json, reports/gitleaks-working-tree.json]

security:image-candidate:
  extends: .docker
  stage: security
  rules: *full_rules
  timeout: 30 minutes
  script:
    - python3 -u -m scripts.docker_job run scan
  artifacts:
    when: always
    expire_in: 7 days
    paths: [reports/trivy-image.json]

security:runtime-images:
  extends: .docker
  stage: security
  rules: *full_rules
  timeout: 30 minutes
  script:
    - python3 -u -m scripts.docker_job run runtime-images
  artifacts:
    when: always
    expire_in: 7 days
    paths: [reports/trivy-agent.json, reports/trivy-runtime.json, reports/trivy-gateway-agent.json, reports/trivy-business-runtime.json, reports/trivy-stateful-runtime.json]

# Native Linux shell executor, dedicated unprivileged account, TWO separate
# rootless daemons. Never bind a VM/system Docker socket into a Docker job.
# Missing runner/delegation is a visible pending/failed gate, not an allowed failure.
integration:runtime-e2e:
  stage: integration
  tags: [runtime-rootless]
  rules: *full_rules
  # The dedicated account currently shares a small test VM with the existing
  # Docker runner. Finish its full stack first, without changing either runner.
  needs:
    - job: integration:managed-stack
      artifacts: false
  timeout: 30 minutes
  variables:
    XARIONIX_RUN_DOCKER_TESTS: "1"
    XARIONIX_RUN_RUNTIME_TESTS: "1"
  script:
    - test -n "$XARIONIX_RUNTIME_ENGINE_SOCKET" || { echo "Configure the dedicated native rootless runtime socket on this runner"; exit 1; }
    - python3 -m venv .venv
    - .venv/bin/python -m pip install -r requirements-dev.lock
    - .venv/bin/python -m pip install --no-deps -e .
    - .venv/bin/python -m pytest tests/integration/test_runtime_e2e.py -vv -s --junitxml=reports/runtime-e2e.xml
  artifacts:
    when: always
    expire_in: 14 days
    paths: [reports/runtime-e2e.xml, reports/runtime-benchmark.json, reports/integration-diagnostics.json]
    reports:
      junit: reports/runtime-e2e.xml

module-gateway:unit:
  extends: .python
  stage: test
  script:
    - .venv/bin/python -m pytest tests/test_module_gateway*.py -vv --junitxml=reports/gateway-unit.xml
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: reports/gateway-unit.xml

module-gateway:security:
  extends: .python
  stage: security
  script:
    - .venv/bin/bandit -q -r app/domains/module_gateway app/api/v1/module_gateway.py scripts/gateway_agent.py scripts/deployment_agent
    - .venv/bin/python -m pytest tests/test_module_gateway*.py -vv

module-gateway:runtime-e2e:
  stage: integration
  tags: [runtime-rootless]
  rules: *full_rules
  needs:
    - job: integration:runtime-e2e
      artifacts: false
  timeout: 30 minutes
  variables:
    XARIONIX_RUN_DOCKER_TESTS: "1"
    XARIONIX_RUN_GATEWAY_TESTS: "1"
  script:
    - test -n "$XARIONIX_RUNTIME_ENGINE_SOCKET" || { echo "Native rootless gateway E2E requires the dedicated runtime socket and real cgroup delegation"; exit 1; }
    - python3 -m venv .venv
    - .venv/bin/python -m pip install -r requirements-dev.lock
    - .venv/bin/python -m pip install --no-deps -e .
    - .venv/bin/python -m pytest tests/integration/test_module_gateway_e2e.py -vv --junitxml=reports/gateway-e2e.xml
  artifacts:
    when: always
    expire_in: 14 days
    paths: [reports/gateway-e2e.xml, reports/gateway-benchmark.json, reports/integration-diagnostics.json]
    reports:
      junit: reports/gateway-e2e.xml

module-storage:runtime-e2e:
  stage: integration
  tags: [runtime-rootless]
  rules: *full_rules
  needs:
    - job: module-gateway:runtime-e2e
      artifacts: false
  timeout: 45 minutes
  variables:
    XARIONIX_RUN_DOCKER_TESTS: "1"
    XARIONIX_RUN_STATEFUL_TESTS: "1"
  script:
    - test -n "$XARIONIX_RUNTIME_ENGINE_SOCKET" || { echo "Stateful E2E requires the dedicated native rootless runtime socket with cgroup v2 delegation"; exit 1; }
    - python3 -m venv .venv
    - .venv/bin/python -m pip install -r requirements-dev.lock
    - .venv/bin/python -m pip install --no-deps -e .
    - .venv/bin/python -m pytest tests/integration/test_stateful_runtime_e2e.py -vv --junitxml=reports/stateful-e2e.xml
  artifacts:
    when: always
    expire_in: 14 days
    paths: [reports/stateful-e2e.xml, reports/integration-diagnostics.json]
    reports:
      junit: reports/stateful-e2e.xml

build:production:
  extends: .docker
  stage: build
  rules: *full_rules
  timeout: 30 minutes
  script:
    # Includes non-root smoke, Trivy of the EXACT artifact and export (no rebuild in publish).
    - python3 -u -m scripts.docker_job run build
  artifacts:
    expire_in: 1 day
    access: developer
    paths: [dist/core-image.tar, dist/image.json, reports/trivy-image.json]

publish:protected-release:
  extends: .docker
  stage: publish
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
  dependencies: [build:production]
  resource_group: core-release
  script:
    - python3 -u -m scripts.docker_job run publish
